<script id="gl2-noise" type="x-shader/x-fragment">#version 300 es
// Tileable noise volumes (Perlin-Worley shape, Worley detail) and the 2D weather map.
precision highp float;
uniform float uZ, uN;
uniform int uKind;          // 0 shape, 1 detail, 2 weather
out vec4 o;

vec3 hash33(vec3 p) {
  p = fract(p * vec3(.1031, .1030, .0973));
  p += dot(p, p.yxz + 33.33);
  return fract((p.xxy + p.yxx) * p.zyx);
}
float remap(float v, float a, float b, float c, float d) { return c + (v - a) * (d - c) / (b - a); }

float worley(vec3 p, float per) {
  vec3 x = p * per, id = floor(x), f = fract(x);
  float md = 1.;
  for (int k = -1; k <= 1; k++)
  for (int j = -1; j <= 1; j++)
  for (int i = -1; i <= 1; i++) {
    vec3 of = vec3(i, j, k);
    vec3 d = of + hash33(mod(id + of, per) + 17.) - f;
    md = min(md, dot(d, d));
  }
  return 1. - sqrt(md);
}
float wfbm(vec3 p, float per) {
  return worley(p, per) * .625 + worley(p, per * 2.) * .25 + worley(p, per * 4.) * .125;
}
float gdot(vec3 c, vec3 f, float per) { return dot(hash33(mod(c, per) + 3.1) * 2. - 1., f); }
float perlin(vec3 p, float per) {
  vec3 x = p * per, i = floor(x), f = fract(x);
  vec3 u = f * f * f * (f * (f * 6. - 15.) + 10.);
  float a = gdot(i, f, per);
  float b = gdot(i + vec3(1, 0, 0), f - vec3(1, 0, 0), per);
  float c = gdot(i + vec3(0, 1, 0), f - vec3(0, 1, 0), per);
  float d = gdot(i + vec3(1, 1, 0), f - vec3(1, 1, 0), per);
  float e = gdot(i + vec3(0, 0, 1), f - vec3(0, 0, 1), per);
  float g = gdot(i + vec3(1, 0, 1), f - vec3(1, 0, 1), per);
  float h = gdot(i + vec3(0, 1, 1), f - vec3(0, 1, 1), per);
  float k = gdot(i + vec3(1, 1, 1), f - vec3(1, 1, 1), per);
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, g, u.x), mix(h, k, u.x), u.y), u.z);
}
float pfbm(vec3 p, float per, int oct) {
  float s = 0., a = .5, n = 0.;
  for (int i = 0; i < 7; i++) {
    if (i >= oct) break;
    s += a * perlin(p, per); n += a;
    per *= 2.; a *= .5;
  }
  return s / n;
}

// sparse, randomly sized cloud footprints on a jittered grid (tileable)
float blobs(vec2 p, float per, float prob, float r0, float r1, float seed) {
  vec2 x = p * per, id = floor(x), f = fract(x);
  float v = 0.;
  for (int j = -1; j <= 1; j++)
  for (int i = -1; i <= 1; i++) {
    vec2 of = vec2(i, j);
    vec2 c = mod(id + of, per);
    vec3 h = hash33(vec3(c, seed));
    if (h.z > prob) continue;
    vec3 k = hash33(vec3(c, seed + 7.));
    vec2 d = of + .2 + .6 * h.xy - f;
    d.x /= mix(1., 1.6, k.y);                  // wind-elongated
    v = max(v, 1. - length(d) / mix(r0, r1, k.x * k.x));
  }
  return max(v, 0.);
}

void main() {
  if (uKind == 2) {
    vec2 p = gl_FragCoord.xy / uN;
    vec2 q = p + .03 * vec2(pfbm(vec3(p, .3), 12., 4), pfbm(vec3(p, .7), 12., 4));   // irregular footprints
    float big = blobs(q, 10., .5, .26, .46, 1.);
    float mid = blobs(q, 22., .45, .22, .46, 2.);
    float sml = blobs(q, 46., .36, .24, .48, 3.);
    float region = smoothstep(-.18, .28, pfbm(vec3(p, .5), 3., 4));  // clusters and open blue
    float cov = max(big, max(mid * .85, sml * .7));
    float rough = clamp(pfbm(vec3(p, .9), 48., 4) * .9 + .6, 0., 1.);
    cov = smoothstep(0., .7, cov) * mix(.2, 1., region) * mix(.55, 1., rough) * .95;  // moderate: let the 3D noise carve
    float type = clamp(big * 1.7 + mid * .55 + sml * .15, 0., 1.);  // big bodies tower, small ones stay flat
    o = vec4(cov, type, region, 1.);
    return;
  }
  vec3 p = vec3(gl_FragCoord.xy / uN, uZ);
  if (uKind == 0) {
    float pn = clamp(pfbm(p, 4., 6) * .75 + .5, 0., 1.);
    float w = wfbm(p, 4.);
    o = vec4(clamp(remap(pn, 0., 1., w, 1.), 0., 1.), w, wfbm(p, 8.), wfbm(p, 16.));
  } else {
    o = vec4(wfbm(p, 4.), wfbm(p, 8.), wfbm(p, 16.), 1.);
  }
}
</script>


<script id="gl2-terrain" type="x-shader/x-fragment">
// The land: a smooth rolling heightfield in world metres. x east, y up, -z north (the opening view).
// Mirrored exactly by hillH() in the script below, which the walker stands on.
uniform vec2 uCamXZ;
uniform float uEye;
float hillH(vec2 xz) {
  float x = xz.x, s = -xz.y;
  float crest = 440. + 90. * sin(x * .0021 + .4) + 40. * sin(x * .0053 + 2.3);   // a crest that curves across the view
  float v = (x - 430.) / 130.;
  float amp = 60. + 22. * cos((x + 95.) * .0068) + 16. * exp(-v * v);           // high left of centre, a dip, a small rise
  float k = s < crest ? 250. : 560.;                                              // a gentle face toward us, a long fall behind
  float a = (s - crest) / k, b = (s - 120.) / 160., c = (s - 1800. - 260. * sin(x * .0011)) / 620.;
  float h = amp * exp(-a * a);
  h += 10. * exp(-b * b) * (.5 + .5 * sin(x * .006 + 2.4));                       // a soft swell in the foreground
  h += 36. * exp(-c * c) * (.55 + .45 * sin(x * .0021 + 4.));                      // far hills
  h += 9. * sin(x * .0085 + s * .0035 + 1.) * sin(s * .0062 - x * .002) * min(1., s / 150.);   // rolls that catch the light
  h += 1.1 * sin(x * .019 + s * .012) * sin(s * .016 - x * .008);                 // gentle undulations
  float m = smoothstep(650., 1700., length(xz - vec2(0., -500.)));                // beyond the first hill, the land keeps rolling
  h += m * (16. * sin(x * .0029 + 1.7 * sin(xz.y * .0019)) * cos(xz.y * .0024 + .8 * sin(x * .0016))
          + 8. * sin(x * .0067 - xz.y * .0051 + 1.3) * sin(xz.y * .0059 + x * .0027));
  return h;
}
vec3 hillOrigin() { return vec3(uCamXZ.x, hillH(uCamXZ) + uEye, uCamXZ.y); }
float hillMarch(vec3 ro, vec3 rd) {
  if (rd.y > .45) return -1.;
  float t = .5, lt = .5;
  for (int i = 0; i < 180; i++) {
    vec3 p = ro + rd * t;
    float h = p.y - hillH(p.xz);
    if (h < .0008 * t) {
      float a = lt, b = t;                                                        // refine for a crisp crest line
      for (int j = 0; j < 6; j++) {
        float m = .5 * (a + b);
        vec3 q = ro + rd * m;
        if (q.y < hillH(q.xz)) b = m; else a = m;
      }
      return b;
    }
    if ((p.y > 190. && rd.y >= 0.) || t > 20000.) return -1.;
    lt = t;
    t += max(h * .6, .03 * t + .4);                                               // bisection fixes any overshoot
  }
  return rd.y < 0. ? t : -1.;                                                     // out of steps looking down: far-off land
}
</script>

<script id="gl2-cloud" type="x-shader/x-fragment">#version 300 es
// Raymarched cumulus in a curved slab above a ground camera, temporally accumulated.
precision highp float;
precision highp sampler2D;
precision highp sampler3D;
uniform sampler3D uShape, uDetail;
uniform sampler2D uWeather, uSky, uHist;
uniform vec2 uRes, uTan;
uniform vec3 uF, uR, uU, uPF, uPR, uPU;
uniform float uTime, uFrame, uHistOK, uSteps, uEnc, uBlend;
uniform vec3 uSunDir, uSunCol, uAmbTop, uAmbBot;
out vec4 o;
//#include terrain

const float PI = 3.14159265;
const float RP = 6371000., HB = 1500., HT = 4000., TH = 2500.;  // planet radius, cloud base & top (m)
const float WSCALE = 40000., SSCALE = 3300., DSCALE = 400.;     // weather, shape, detail tile sizes (m)
const float SIGMA = .065;                                       // extinction per metre at density 1
const float SIGMA_L = .12;                                      // self-shadowing extinction toward the sun
const float MAXD = 70000., HAZE = 24000.;

float remap(float v, float a, float b, float c, float d) { return c + (v - a) * (d - c) / (b - a); }

vec3 skyL(vec3 d) {
  float el = asin(clamp(d.y, -1., 1.));
  float v = sqrt(clamp((el + .07) / (PI * .5 + .07), 0., 1.));
  return textureLod(uSky, vec2(atan(d.x, -d.z) / (2. * PI) + .5, v), 0.).rgb;
}

vec2 windAt(float hf) { return vec2(9., 2.5) * (1. + .35 * hf) * uTime; }  // m/s, a little shear with height

float density(vec3 p, float hf, bool hi, out float cov) {
  vec2 xz = p.xz + windAt(hf);
  vec4 w = textureLod(uWeather, xz / WSCALE, 0.);
  cov = w.r;
  if (w.r < .02 || hf < 0. || hf > 1.) return 0.;
  float top = mix(.1, 1., w.g * smoothstep(.15, .5, w.r));
  vec3 q = vec3(xz.x, p.y - uTime * 1.3, xz.y) / SSCALE;                          // billows slowly rise
  vec4 n = textureLod(uShape, q, 0.);
  float wf = n.g * .625 + n.b * .25 + n.a * .125;
  float hn = hf + (wf - .5) * .35 * top;                                          // lumpy crowns, never a smooth dome
  float grad = smoothstep(0., .035, hf) * (1. - smoothstep(top * .3, top, hn));   // flat base, billowing top
  if (grad <= 0.) return 0.;
  float pw = clamp(remap(n.r, .55, .9, 0., 1.), 0., 1.);                        // Perlin-Worley, normalised to its measured range
  float base = clamp(remap(pw, (1. - wf) * .55, 1., 0., 1.), 0., 1.);            // low-frequency Worley carves the billows
  float c = min(w.r * 1.3, 1.) * mix(1., .4, pow(clamp(hn / top, 0., 1.), 1.5));  // domed: narrower toward the top
  base = remap(base * grad, 1. - c, 1., 0., 1.) * c;
  if (base <= 0.) return 0.;
  if (hi) {
    vec3 dq = vec3(xz.x, p.y, xz.y) / DSCALE + vec3(uTime * .004, -uTime * .007, 0.);
    vec3 dn = textureLod(uDetail, dq, 0.).rgb;
    float df = dn.r * .625 + dn.g * .25 + dn.b * .125;
    df = mix(df, 1. - df, clamp(hf * 4., 0., 1.));                                // billowy, cauliflower crowns
    base = remap(base, df * .75 * smoothstep(0., .22, hf / top), 1., 0., 1.);     // ...but clean, flat bases
    base *= mix(1., .45 + .9 * df, .55 * smoothstep(0., .3, hf / top));            // interior lumps catch the light
  }
  return clamp(base * 2.6, 0., 1.);                                               // crisp edges: density rises fast
}

float hg(float c, float g) {
  float g2 = g * g;
  return (1. - g2) / (4. * PI * pow(max(1. + g2 - 2. * g * c, 1e-4), 1.5));
}
float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(.06711056, .00583715)))); }

vec4 march(vec3 d, vec3 sky) {
  if (d.y < -.01) return vec4(0., 0., 0., 1.);
  float b = RP * d.y;
  float xb = HB * (2. * RP + HB), xt = HT * (2. * RP + HT);
  float t0 = xb / (b + sqrt(b * b + xb));                 // stable ray / sphere-shell intersection
  float t1 = xt / (b + sqrt(b * b + xt));
  if (t0 > MAXD) return vec4(0., 0., 0., 1.);
  t1 = min(min(t1, t0 + 24000.), MAXD);
  float dt = (t1 - t0) / uSteps;
  float t = t0 + dt * fract(ign(gl_FragCoord.xy) + uFrame * .618034);  // blue-ish noise, new every frame

  float mu = dot(d, uSunDir);
  // dual-lobe Henyey-Greenstein, and softer lobes for the multiple-scattering octaves
  float ph0 = mix(hg(mu, -.3), hg(mu, .8), .7);
  float ph1 = mix(hg(mu, -.15), hg(mu, .4), .7);
  float ph2 = mix(hg(mu, -.075), hg(mu, .2), .7);

  vec3 C = vec3(0.);
  float T = 1., wd = 0., ws = 0., fine = 0.;
  for (int i = 0; i < 200; i++) {
    if (t > t1 || T < .01) break;
    vec3 p = d * t;
    float h = length(vec3(p.x, p.y + RP, p.z)) - RP;
    float hf = (h - HB) / TH;
    vec3 pos = vec3(p.x + uCamXZ.x, h, p.z + uCamXZ.y);              // clouds stay put as you walk
    float cov;
    float den = density(pos, hf, true, cov);
    if (fine <= 0. && cov >= .02) { t -= dt; fine = 8.; continue; }   // entering a footprint: back up, go fine
    if (den > .003) {
      fine = 8.;
      // march toward the sun: 6 growing steps, the last one long
      float od = 0., ls = 40.;
      vec3 lp = pos;
      for (int j = 0; j < 6; j++) {
        float sl = j == 5 ? ls * 3.5 : ls;
        lp += uSunDir * sl;
        float lhf = (lp.y - HB) / TH;
        if (lhf > 1.) break;
        float c2;
        od += density(lp, lhf, j < 2, c2) * sl;
        ls *= 1.7;
      }
      // Beer–Lambert toward the sun + multiple-scattering octaves (extinction and phase halve each octave)
      float sl0 = SIGMA_L * od;
      vec3 sun = uSunCol * 4.6 * (ph0 * exp(-sl0)
                                + .24 * ph1 * exp(-sl0 * .5)
                                + .07 * ph2 * exp(-sl0 * .25));
      float powder = 1. - exp(-den * SIGMA * 110.);
      sun *= mix(1., powder, .55 * (.5 - .5 * mu));        // dark, thick edges when facing away from the sun
      vec3 amb = mix(uAmbBot, uAmbTop, smoothstep(0., .75, hf));
      float Tr = exp(-SIGMA * den * dt);
      C += T * (sun + amb) * (1. - Tr);                     // energy-conserving step integration
      float a = T * (1. - Tr); wd += a * t; ws += a;
      T *= Tr;
      t += dt;
    } else {
      fine -= 1.;
      t += fine > 0. ? dt : dt * 2.;                        // large strides through empty air
    }
  }
  // aerial perspective: distant clouds dissolve into the sky's own haze
  float fogT = exp(-(ws > 0. ? wd / ws : t0) / HAZE);
  C = C * fogT + sky * (1. - T) * (1. - fogT);
  return vec4(C, T);
}

void main() {
  vec2 ndc = gl_FragCoord.xy / uRes * 2. - 1.;
  vec3 d = normalize(uF + ndc.x * uTan.x * uR + ndc.y * uTan.y * uU);
  vec4 cur = hillMarch(hillOrigin(), d) > 0. ? vec4(0., 0., 0., 1.) : march(d, skyL(d));  // the hill hides what's behind it

  // reproject through last frame's camera (clouds are far enough that turning is all that matters)
  float pz = dot(d, uPF);
  vec2 puv = vec2(dot(d, uPR), dot(d, uPU)) / (pz * uTan) * .5 + .5;
  vec4 hist = textureLod(uHist, puv, 0.);
  hist.rgb *= uEnc;
  bool ok = uHistOK > .5 && pz > 0. && all(greaterThanEqual(puv, vec2(0.))) && all(lessThanEqual(puv, vec2(1.)));
  vec4 r = ok ? mix(hist, cur, uBlend) : cur;
  o = vec4(r.rgb / uEnc, r.a);
  // 8-bit history: round stochastically so small per-frame blends never stall
  if (uEnc > 1.) o += (fract(ign(gl_FragCoord.yx + uFrame * 3.7) + uFrame * .754877) - .5) / 255.;
}
</script>

<script id="gl2-comp" type="x-shader/x-fragment">#version 300 es
// Full-resolution composite: sky, cirrus, upsampled clouds, ACES, sRGB, dither.
precision highp float;
precision highp sampler2D;
uniform sampler2D uCloud, uSky, uWeather;
uniform vec2 uRes, uTan;
uniform vec3 uF, uR, uU, uSunDir, uSunCol, uAmbTop;
uniform float uExp, uSat, uFade, uEnc, uFrame, uTime;
out vec4 o;
const float PI = 3.14159265;
//#include terrain

vec3 skyL(vec3 d) {
  float el = asin(clamp(d.y, -1., 1.));
  float v = sqrt(clamp((el + .07) / (PI * .5 + .07), 0., 1.));
  return textureLod(uSky, vec2(atan(d.x, -d.z) / (2. * PI) + .5, v), 0.).rgb;
}
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * .1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0., a = .5;
  for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= .5; }
  return s;
}
// thin, wind-combed cirrus on a plane at ~9 km
float cirrus(vec3 d) {
  if (d.y < .03) return 0.;
  vec2 xz = d.xz * (9000. / d.y) + vec2(14., 3.) * uTime;
  vec2 q = vec2(xz.x * .00008 + xz.y * .00005, xz.y * .0006 - xz.x * .00012);
  float n = fbm(q + fbm(q * .7) * 1.2);
  float m = smoothstep(.5, .72, fbm(xz * .00007 + 3.1)) * smoothstep(.35, .6, fbm(q * 3.1 + 7.));
  float fade = smoothstep(.03, .25, d.y);
  return smoothstep(.6, .85, n) * m * fade * .07;
}
// Catmull-Rom bicubic in 9 bilinear taps: sharp upsampling of the half-resolution clouds
vec4 sampleCR(sampler2D tex, vec2 uv) {
  vec2 size = vec2(textureSize(tex, 0));
  vec2 p = uv * size, tc = floor(p - .5) + .5, f = p - tc;
  vec2 w0 = f * (-.5 + f * (1. - .5 * f)), w1 = 1. + f * f * (-2.5 + 1.5 * f);
  vec2 w2 = f * (.5 + f * (2. - 1.5 * f)), w3 = f * f * (-.5 + .5 * f);
  vec2 w12 = w1 + w2, o12 = w2 / w12;
  vec2 t0 = (tc - 1.) / size, t3 = (tc + 2.) / size, t12 = (tc + o12) / size;
  vec4 r = vec4(0.);
  r += texture(tex, vec2(t0.x, t0.y)) * w0.x * w0.y;
  r += texture(tex, vec2(t12.x, t0.y)) * w12.x * w0.y;
  r += texture(tex, vec2(t3.x, t0.y)) * w3.x * w0.y;
  r += texture(tex, vec2(t0.x, t12.y)) * w0.x * w12.y;
  r += texture(tex, vec2(t12.x, t12.y)) * w12.x * w12.y;
  r += texture(tex, vec2(t3.x, t12.y)) * w3.x * w12.y;
  r += texture(tex, vec2(t0.x, t3.y)) * w0.x * w3.y;
  r += texture(tex, vec2(t12.x, t3.y)) * w12.x * w3.y;

  } else {
    if (d.y < .015) sky = skyL(normalize(vec3(d.x, .015, d.z))) * .88;             // land beyond sight: lost in haze
    vec4 c = sampleCR(uCloud, uv);
    c.a = clamp(c.a, 0., 1.);
    col = sky * mix(1., c.a, uFade) + c.rgb * uEnc * uFade;
    col += uSunCol * 40. * smoothstep(.99997, .99999, dot(d, uSunDir)) * mix(1., c.a, uFade);  // the sun itself, when you look for it
  }

  float l = dot(col, vec3(.2126, .7152, .0722));
  col = max(mix(vec3(l), col, th > 0. ? 1.12 : uSat), 0.);   // a polariser deepens the sky; the grass stays natural

      const ds = hit(o, d, RA) / n, od = [0, 0, 0];

      const od = [0, 0, 0], L = [0, 0, 0];

      const VS = '#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';

        const s = gl.createShader(type);

      };

        gl.attachShader(p, sh(gl.FRAGMENT_SHADER, document.getElementById(id).textContent
          .replace('//#include terrain', document.getElementById('gl2-terrain').textContent)));

        bind(2, gl.TEXTURE_2D, weatherTex, 'uWeather', pCloud);
        bind(3, gl.TEXTURE_2D, skyTex, 'uSky', pCloud);

        gl.uniform3fv(pCloud.u('uF'), cam.f); gl.uniform3fv(pCloud.u('uR'), cam.r); gl.uniform3fv(pCloud.u('uU'), cam.u);
        gl.uniform3fv(pCloud.u('uPF'), prev.f); gl.uniform3fv(pCloud.u('uPR'), prev.r); gl.uniform3fv(pCloud.u('uPU'), prev.u);
        gl.uniform1f(pCloud.u('uTime'), s.time);

        gl.uniform1f(pCloud.u('uHistOK'), histOK);

        gl.uniform1f(pCloud.u('uBlend'), Math.min(.1 + turn * 12, .6));   // fresh samples while turning, calm accumulation at rest
        gl.uniform1f(pCloud.u('uSteps'), Q[q][1]);

        gl.uniform3fv(pCloud.u('uSunDir'), SUN);
        gl.uniform3fv(pCloud.u('uSunCol'), atm.sunCol);
        gl.uniform3fv(pCloud.u('uAmbTop'), atm.ambTop);
        gl.uniform3fv(pCloud.u('uAmbBot'), atm.ambBot);

        gl.uniform3fv(pComp.u('uSunDir'), SUN);
        gl.uniform3fv(pComp.u('uSunCol'), atm.sunCol);
        gl.uniform3fv(pComp.u('uAmbTop'), atm.ambTop);
        gl.uniform1f(pComp.u('uExp'), .9);
        gl.uniform1f(pComp.u('uSat'), 1.5);

        gl.uniform1f(pComp.u('uEnc'), enc);

        gl, levels: Q.length, start: 0,

      console.warn(e);
      return null;
    }
  }

  const R = createGL2(cvs);
  if (!R) return; // the CSS hill and sky stay

  /* ======================= you, standing in the meadow ======================= */
  const EYE = 1.62, WALK = 4.3, SPRINT = 5.6, GRAVITY = 28, JUMP = 8.4, SENS = .0022;
  const me = { x: 0, z: 0, y: hillH(0, 0), vx: 0, vz: 0, vy: 0, yaw: 0, pitch: 8 * DEG, ground: true, bob: 0 };
  const keys = new Set();
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const look = (dx, dy) => {
    me.yaw += dx * SENS;
    me.pitch = clamp(me.pitch - dy * SENS, -89 * DEG, 89 * DEG);
  };

  // keyboard: arrows or WASD to walk, Shift to sprint, Space to jump
  const KEYMAP = { ArrowUp: 'f', KeyW: 'f', ArrowDown: 'b', KeyS: 'b', ArrowLeft: 'l', KeyA: 'l',
                   ArrowRight: 'r', KeyD: 'r', Space: 'j', ShiftLeft: 's', ShiftRight: 's' };
  addEventListener('keydown', e => {
    const k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    keys.add(k);
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
  addEventListener('blur', () => keys.clear());

  // mouse: click to take the mouse (pointer lock), then look freely; dragging works too
  let dragging = false, lastX = 0, lastY = 0;
  cvs.addEventListener('mousedown', e => {
    if (document.pointerLockElement !== cvs && cvs.requestPointerLock) {
      try { const p = cvs.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (err) {}
    }
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  addEventListener('mouseup', () => { dragging = false; });
  addEventListener('mousemove', e => {
    if (document.pointerLockElement === cvs) look(e.movementX, e.movementY);
    else if (dragging) { look(e.clientX - lastX, e.clientY - lastY); lastX = e.clientX; lastY = e.clientY; }
  });

  // touch: drag on the left to walk, drag on the right to look, double-tap to jump
  const stick = { id: null, x: 0, y: 0, mx: 0, my: 0 }, lookers = new Map();
  let lastTap = 0;
  addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    if (e.clientX < innerWidth * .4 && stick.id === null) Object.assign(stick, { id: e.pointerId, x: e.clientX, y: e.clientY, mx: 0, my: 0 });
    else lookers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const now = performance.now();
    if (now - lastTap < 300) keys.add('tapjump');
    lastTap = now;
  }, { passive: true });
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'touch') return;
    if (e.pointerId === stick.id) {
      stick.mx = clamp((e.clientX - stick.x) / 60, -1, 1);
      stick.my = clamp((e.clientY - stick.y) / 60, -1, 1);
    } else if (lookers.has(e.pointerId)) {
      const l = lookers.get(e.pointerId);
      look((e.clientX - l.x) * 1.6, (e.clientY - l.y) * 1.6);
      l.x = e.clientX; l.y = e.clientY;
    }
  }, { passive: true });
  const endTouch = e => {
    if (e.pointerId === stick.id) Object.assign(stick, { id: null, mx: 0, my: 0 });
    lookers.delete(e.pointerId);
  };
  addEventListener('pointerup', endTouch, { passive: true });
  addEventListener('pointercancel', endTouch, { passive: true });

  function walk(dt) {
    let fwd = (keys.has('f') ? 1 : 0) - (keys.has('b') ? 1 : 0) - stick.my;
    let side = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0) + stick.mx;
    const len = Math.hypot(fwd, side);
    if (len > 1) { fwd /= len; side /= len; }
    const speed = keys.has('s') ? SPRINT : WALK;
    const sy = Math.sin(me.yaw), cy = Math.cos(me.yaw);
    const tx = (sy * fwd + cy * side) * speed, tz = (-cy * fwd + sy * side) * speed;
    const grip = 1 - Math.exp(-dt * (me.ground ? 14 : 2.5));      // snappy on the ground, floaty in the air
    me.vx += (tx - me.vx) * grip;
    me.vz += (tz - me.vz) * grip;
    me.x += me.vx * dt;
    me.z += me.vz * dt;

    if ((keys.has('j') || keys.has('tapjump')) && me.ground) { me.vy = JUMP; me.ground = false; }
    keys.delete('tapjump');
    me.vy -= GRAVITY * dt;
    me.y += me.vy * dt;
    const g = hillH(me.x, me.z);
    if (me.y <= g || (me.ground && me.vy <= 0 && me.y - g < .35)) {   // stay on the grass walking downhill
      me.y = g; me.vy = 0; me.ground = true;
    } else me.ground = false;

    const moving = me.ground ? Math.min(Math.hypot(me.vx, me.vz) / WALK, 1.3) : 0;
    me.bob += dt * Math.hypot(me.vx, me.vz) * 1.9;
    const bob = reduced ? 0 : Math.sin(me.bob * 2) * .04 * moving;
    return { yaw: me.yaw, pitch: me.pitch, x: me.x, z: me.z, eye: me.y + EYE + bob - g };
  }

  /* ======================= lifecycle ======================= */
  let raf = 0, last = 0, clock = 0, fadeStart = -1, frameAvg = 16.7, slowFor = 0, fastFor = 0, frames = 0;
  let step = R.start, needsResize = true, lastQualityChange = 0;
  addEventListener('resize', () => { needsResize = true; });
  addEventListener('orientationchange', () => { needsResize = true; });

  function frame(ts) {
    raf = requestAnimationFrame(frame);
    const dt = last ? Math.min((ts - last) / 1000, .05) : 1 / 60;
    last = ts;
    if (needsResize) { R.setQuality(step); R.resize(innerWidth, innerHeight); needsResize = false; }

    clock += dt * (reduced ? .2 : 1);
    const view = walk(dt);

    if (fadeStart < 0) fadeStart = ts;
    const f = Math.min((ts - fadeStart) / 2600, 1);
    R.frame({ time: clock + 40, fade: 1 - Math.pow(1 - f, 3), view });

    if (!cvs.classList.contains('ready')) cvs.classList.add('ready');

    // adapt resolution and step count to hold the frame rate
    if (++frames > 30) {
      frameAvg += (dt * 1000 - frameAvg) * .08;
      if (ts - lastQualityChange > 2000) {
        if (frameAvg > 20) slowFor += dt; else slowFor = 0;
        if (frameAvg < 12) fastFor += dt; else fastFor = 0;
        if (slowFor > 1 && step < R.levels - 1) { step++; needsResize = true; lastQualityChange = ts; slowFor = 0; }
        else if (fastFor > 6 && step > 0) { step--; needsResize = true; lastQualityChange = ts; fastFor = 0; }
      }
    }
  }

  function start() { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } }
  function pause() { cancelAnimationFrame(raf); raf = 0; }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); keys.clear(); } else start(); });
  cvs.addEventListener('webglcontextlost', e => { e.preventDefault(); pause(); cvs.classList.remove('ready'); });

  start();
})();
</script>
</body>
</html>
